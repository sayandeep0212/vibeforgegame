        @font-face {
            font-family: 'CasualPassionDemo';
            src: url('fonts/CasualPassionDemo.ttf') format('truetype');
        }
		body {
			margin: 0;
			padding: 0;
			background-color: #000000;
            overflow: hidden;
		}
        #canvasArea {
            margin-left: auto;
            margin-right: auto;
            overflow: hidden;
        }
        
        #custom-splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            color: white;
            transition: opacity 0.5s ease-out;
        }

        .logos-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .logo-box {
            width: 40px;
            height: 40px;
            background-color: white;
            border-radius: 8px;
            opacity: 0.9;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo-box.blue {
            background-color: #0a2463; /* Blue crest color */
        }
        .logo-box img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }

        .presents-text {
            font-size: 10px;
            letter-spacing: 6px;
            color: #888;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .hackathon-text {
            font-size: 22px;
            color: #ffd700;
            letter-spacing: 2px;
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .vibeforge-text {
            font-family: 'CasualPassionDemo', sans-serif;
            font-size: 90px;
            font-weight: 900;
            font-style: italic;
            background: linear-gradient(90deg, #ffeb3b 0%, #ff9800 50%, #f44336 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            margin-bottom: 30px;
            transform: skewX(-5deg);
            filter: drop-shadow(0 0 15px rgba(244, 67, 54, 0.3));
            animation: pulse 2s infinite;
        }

        .vibeforge-text .version {
            font-family: 'Orbitron', sans-serif;
            font-size: 80px;
            color: #f44336;
            background: none;
            -webkit-text-fill-color: #f44336;
        }

        .red-line {
            width: 250px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #f44336, transparent);
            margin-top: 10px;
        }

        @keyframes pulse {
            0% { filter: drop-shadow(0 0 15px rgba(244, 67, 54, 0.3)); }
            50% { filter: drop-shadow(0 0 25px rgba(244, 67, 54, 0.6)); }
            100% { filter: drop-shadow(0 0 15px rgba(244, 67, 54, 0.3)); }
        }

        @media (max-width: 768px) {
            .vibeforge-text { font-size: 50px; }
            .vibeforge-text .version { font-size: 45px; }
            .hackathon-text { font-size: 14px; }
            .presents-text { font-size: 8px; }
        }
	</style>

            <!-- Blue crest logo -->
            <div class="logo-box blue"><img src="logos/au_logo.jpg" alt="AU Logo" style="border-radius: 5px;"></div>
            <!-- White rounded logo -->

    </div>
	<script>

    (function() {
        //Initialization
        var game = new gdjs.RuntimeGame(gdjs.projectData, {});

        //Create a renderer
        game.getRenderer().createStandardCanvas(document.body);

        //Bind keyboards/mouse/touch events
        game.getRenderer().bindStandardEvents(game.getInputManager(), window, document);

        //Load all assets and start the game
        game.loadAllAssets(function() {
            game.startGameLoop();
            
            // Keep the splash screen visible for a minimum time, then fade it out
            setTimeout(function() {
                var splash = document.getElementById('custom-splash');
                if (splash) {
                    splash.style.opacity = '0';
                    setTimeout(function() {
                        splash.style.display = 'none';
                    }, 500); // Wait for transition to finish
                }
            }, 3000);
        });
    })();

	</script>
